<h2>Räume</h2>

<form (ngSubmit)="anlegen()">
  Bezeichnung: <input name="bezeichnung" [(ngModel)]="bezeichnung" required>
  <button type="submit">Anlegen</button>
</form>

<br>

<table>
  <tr>
    <th>Id</th>
    <th>Bezeichnung</th>
  </tr>
  <tr *ngFor="let r of raeume">
    <td>{{ r.id }}</td>
    <td>{{ r.bezeichnung }}</td>
  </tr>
</table>
